name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * *" # nightly: also runs the cluster tier
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: make lint doc

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  # Unit tests only: proves the workspace builds and tests without any database.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: make test-unit

  # Live tests against a dedicated TiDB, the minimum supported version (same as local `make db-up`).
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Start TiDB
        run: TIDB_RUNNER=docker TIDB_VERSION=v8.5.8 scripts/tidb.sh up
      - name: Live tests
        # No Unix socket with the docker runner: socket auth is reported as not tested.
        run: make test-live TEST_SOCKET=
      - name: Offline query data is up to date
        run: make prepare-check

  # Real cluster (PD, TiKV, TiFlash, 2 TiDB nodes) via tiup playground: slow, nightly only.
  cluster:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install tiup
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://tiup-mirrors.pingcap.com/install.sh | sh
          echo "$HOME/.tiup/bin" >> "$GITHUB_PATH"
      # Apart from the start: the binaries are large, and `make db-cluster` only waits for the
      # cluster to come up.
      - name: Download the cluster binaries
        run: scripts/tidb.sh cluster-install
      - run: make db-cluster
      - run: make test-cluster
      - name: Cluster logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cluster-logs
          path: |
            target/tidb-cluster-*/playground.log
            ~/.tiup/data/**/*.log
          if-no-files-found: ignore

  # RawKV client against a TiKV-only playground (1 PD, 1 TiKV): light enough for every run.
  rawkv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install tiup
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://tiup-mirrors.pingcap.com/install.sh | sh
          echo "$HOME/.tiup/bin" >> "$GITHUB_PATH"
      - run: make db-rawkv
      - run: make test-rawkv
      - name: RawKV logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rawkv-logs
          path: |
            target/rawkv-*/playground.log
            ~/.tiup/data/**/*.log
          if-no-files-found: ignore

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Fails on a vulnerability; an informational advisory (unmaintained, unsound) only warns.
      - run: make audit
