name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * *" # nightly: also runs the cluster tier
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: make lint features

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --all-features

  # Unit tests only: proves the workspace builds and tests without any database.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: make test-unit

  # Live tests against a dedicated TiDB (same version as local `make db-up`).
  live:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tidb: [v8.5.8, v7.5.6]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Start TiDB
        run: TIDB_RUNNER=docker TIDB_VERSION=${{ matrix.tidb }} scripts/tidb.sh up
      - name: Live tests
        # No Unix socket with the docker runner: socket auth is reported as not tested.
        run: make test-live TEST_SOCKET=
      - name: Offline query data is up to date
        if: matrix.tidb == 'v8.5.8'
        run: make prepare-check

  # Real cluster (PD, TiKV, TiFlash, 2 TiDB nodes) via tiup playground: slow, nightly only.
  cluster:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install tiup
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://tiup-mirrors.pingcap.com/install.sh | sh
          echo "$HOME/.tiup/bin" >> "$GITHUB_PATH"
      - run: make db-cluster
      - run: make test-cluster

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
