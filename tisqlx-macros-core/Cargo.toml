[package]
name = "tisqlx-macros-core"
description = "Implementation of the tisqlx procedural macros (not for direct use)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
chrono = ["tisqlx-core/chrono"]
decimal = ["tisqlx-core/decimal"]
bigdecimal = ["tisqlx-core/bigdecimal"]
time = ["tisqlx-core/time"]

[dependencies]
tisqlx-core.workspace = true
tokio = { workspace = true, features = ["rt"] }
syn.workspace = true
quote.workspace = true
proc-macro2.workspace = true
serde.workspace = true
serde_json.workspace = true
dotenvy.workspace = true

[dev-dependencies]
bigdecimal.workspace = true
chrono.workspace = true
rust_decimal.workspace = true
time.workspace = true

[lints]
workspace = true
