[package]
name = "tisqlx-core"
description = "Core of tisqlx: a pure-Rust async TiDB driver (protocol, types, pool, transactions, migrations)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
tokio.workspace = true
futures-core.workspace = true
futures-util.workspace = true
thiserror.workspace = true
sha1.workspace = true
sha2.workspace = true
url.workspace = true
percent-encoding.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
chrono.workspace = true
rust_decimal.workspace = true
bigdecimal.workspace = true
uuid.workspace = true
jiff.workspace = true
tokio-rustls.workspace = true
webpki-roots.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

# The live suite covers every optional type: `make test` runs it with `--all-features`.
[[test]]
name = "live"
path = "tests/live/main.rs"

[lints]
workspace = true
