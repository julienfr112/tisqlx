[package]
name = "tisqlx-core"
description = "Core of tisqlx: a pure-Rust async TiDB driver (protocol, types, pool, transactions, migrations)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["chrono", "decimal"]
chrono = ["dep:chrono", "dep:jiff"]
decimal = ["dep:rust_decimal"]
bigdecimal = ["dep:bigdecimal"]
time = ["dep:time", "dep:jiff"]
uuid = ["dep:uuid"]

[dependencies]
tokio.workspace = true
futures-core.workspace = true
futures-util.workspace = true
thiserror.workspace = true
sha1.workspace = true
sha2.workspace = true
url.workspace = true
percent-encoding.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
chrono = { workspace = true, optional = true }
rust_decimal = { workspace = true, optional = true }
bigdecimal = { workspace = true, optional = true }
time = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
jiff = { workspace = true, optional = true }
tokio-rustls.workspace = true
webpki-roots.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

# The live suite covers every optional type: `make test` runs it with `--all-features`.
[[test]]
name = "live"
path = "tests/live/main.rs"
required-features = ["chrono", "decimal", "bigdecimal", "time", "uuid"]

[lints]
workspace = true
