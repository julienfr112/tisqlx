[package]
name = "tisqlx-macros"
description = "Procedural macros for tisqlx (not for direct use)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
proc-macro = true

[features]
default = []
chrono = ["tisqlx-macros-core/chrono"]
decimal = ["tisqlx-macros-core/decimal"]
bigdecimal = ["tisqlx-macros-core/bigdecimal"]
time = ["tisqlx-macros-core/time"]

[dependencies]
tisqlx-macros-core.workspace = true
tisqlx-core.workspace = true
proc-macro2.workspace = true
syn.workspace = true
quote.workspace = true

[lints]
workspace = true
